<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大市唱已经被高松灯入侵</title>
<style>
  :root{
    --neon1:#00f0ff;
    --neon2:#ff2bd6;
    --neon3:#a855f7;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#04030a;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"Source Han Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:
      radial-gradient(circle at 50% 50%, rgba(88,28,135,.35), transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(0,240,255,.12), transparent 55%),
      radial-gradient(circle at 80% 20%, rgba(255,43,214,.12), transparent 55%),
      #04030a;
  }
  canvas#bg{position:fixed;inset:0;z-index:0;}

  /* 扫描线 */
  .scanlines{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .scanlines::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,transparent 0%,rgba(0,240,255,.10) 48%,rgba(255,255,255,.16) 50%,rgba(0,240,255,.10) 52%,transparent 100%);
    height:35%;animation:sweep 6s linear infinite;
  }
  @keyframes sweep{
    0%{transform:translateY(-120%);}
    100%{transform:translateY(400%);}
  }

  /* 边框光晕 */
  .frame{
    position:fixed;inset:18px;z-index:4;pointer-events:none;
    border:1px solid rgba(0,240,255,.25);
    box-shadow:0 0 24px rgba(0,240,255,.12) inset, 0 0 40px rgba(168,85,247,.10);
    clip-path:polygon(0 0,40px 0,40px 1px,0 1px,0 0);
  }
  .corner{position:fixed;width:26px;height:26px;z-index:6;border:2px solid var(--neon1);opacity:.8;}
  .c1{top:26px;left:26px;border-right:none;border-bottom:none;}
  .c2{top:26px;right:26px;border-left:none;border-bottom:none;}
  .c3{bottom:26px;left:26px;border-right:none;border-top:none;}
  .c4{bottom:26px;right:26px;border-left:none;border-top:none;}

  .stage{position:relative;z-index:3;text-align:center;padding:0 4vw;}

  /* 主标题：故障文字 */
  .glitch{
    position:relative;
    display:inline-block;
    font-size:clamp(1.05rem,6.2vw,4.6rem);
    font-weight:900;
    letter-spacing:.12em;
    line-height:1.35;
    white-space:nowrap;
    color:#fff;
    text-shadow:
      0 0 6px rgba(255,255,255,.9),
      0 0 18px rgba(0,240,255,.9),
      0 0 42px rgba(0,240,255,.55),
      0 0 80px rgba(168,85,247,.55);
    animation:flicker 4.5s infinite steps(1);
  }
  @keyframes flicker{
    0%,92%,100%{opacity:1;}
    93%{opacity:.35;}
    94%{opacity:1;}
    96%{opacity:.6;}
    97%{opacity:1;}
  }

  .glitch::before,
  .glitch::after{
    content:attr(data-text);
    position:absolute;left:0;top:0;width:100%;
    white-space:nowrap;
    text-shadow:none;
    background:transparent;
  }
  .glitch::before{
    color:var(--neon1);
    clip-path:inset(0 0 62% 0);
    animation:gl1 2.4s infinite linear alternate-reverse;
  }
  .glitch::after{
    color:var(--neon2);
    clip-path:inset(58% 0 0 0);
    animation:gl2 1.9s infinite linear alternate-reverse;
  }
  @keyframes gl1{
    0%{transform:translate(-3px,-2px);clip-path:inset(0 0 72% 0);}
    20%{transform:translate(4px,1px);clip-path:inset(12% 0 55% 0);}
    40%{transform:translate(-5px,0);clip-path:inset(45% 0 30% 0);}
    60%{transform:translate(3px,2px);clip-path:inset(70% 0 8% 0);}
    80%{transform:translate(-2px,-1px);clip-path:inset(28% 0 48% 0);}
    100%{transform:translate(5px,1px);clip-path:inset(0 0 70% 0);}
  }
  @keyframes gl2{
    0%{transform:translate(3px,2px);clip-path:inset(70% 0 0 0);}
    25%{transform:translate(-4px,-1px);clip-path:inset(40% 0 22% 0);}
    50%{transform:translate(5px,1px);clip-path:inset(10% 0 62% 0);}
    75%{transform:translate(-3px,2px);clip-path:inset(58% 0 12% 0);}
    100%{transform:translate(4px,-2px);clip-path:inset(72% 0 0 0);}
  }

  /* 副标题 */
  .sub{
    margin-top:1.6em;
    font-size:clamp(.62rem,1.6vw,1rem);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(0,240,255,.85);
    text-shadow:0 0 12px rgba(0,240,255,.8);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.35;}}

  .jp{
    margin-top:.9em;
    font-size:clamp(.58rem,1.4vw,.86rem);
    letter-spacing:.3em;
    color:rgba(255,255,255,.42);
  }

  .cursor{
    display:inline-block;width:.6em;height:1em;
    background:var(--neon1);
    vertical-align:-.12em;margin-left:.18em;
    animation:blink .9s steps(1) infinite;
    box-shadow:0 0 12px var(--neon1);
  }
  @keyframes blink{50%{opacity:0;}}

  /* 底部状态条 */
  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:7;
    display:flex;justify-content:space-between;gap:1rem;
    padding:10px 30px;
    font-size:11px;letter-spacing:.16em;
    color:rgba(0,240,255,.55);
    text-transform:uppercase;
    pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
  }
  .hud .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#ff2bd6;margin-right:6px;
    box-shadow:0 0 10px #ff2bd6;
    animation:pulse 1.2s infinite;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scanlines"></div>
<div class="frame"></div>
<div class="corner c1"></div>
<div class="corner c2"></div>
<div class="corner c3"></div>
<div class="corner c4"></div>

<div class="stage">
  <div class="glitch" data-text="大市唱已经被高松灯入侵">大市唱已经被高松灯入侵</div>
  <div class="sub">SYSTEM COMPROMISED // ACCESS GRANTED<span class="cursor"></span></div>
  <div class="jp">高松 燈 によって 侵 入 さ れ ま し た</div>
</div>

<div class="hud">
  <span><span class="dot"></span>INTRUSION ACTIVE</span>
  <span id="clock">--:--:--</span>
  <span>NODE: TOMORI-01</span>
</div>

<script>
/* ---------- 背景：数据流 / 星尘粒子 ---------- */
(function(){
  const cvs = document.getElementById('bg');
  const ctx = cvs.getContext('2d');
  let W, H, particles = [], DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = cvs.width  = innerWidth  * DPR;
    H = cvs.height = innerHeight * DPR;
    cvs.style.width  = innerWidth + 'px';
    cvs.style.height = innerHeight + 'px';
    init();
  }

  function init(){
    const count = Math.min(160, Math.floor(innerWidth * innerHeight / 11000));
    particles = Array.from({length: count}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (Math.random() * 1.6 + 0.4) * DPR,
      vy: (Math.random() * 0.45 + 0.12) * DPR,
      vx: (Math.random() - 0.5) * 0.18 * DPR,
      hue: Math.random() < 0.5 ? 188 : 315,
      a: Math.random() * 0.55 + 0.15
    }));
  }

  function draw(){
    ctx.fillStyle = 'rgba(4,3,10,0.28)';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles){
      p.x += p.vx; p.y += p.vy;
      if (p.y - p.r > H){ p.y = -p.r; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},100%,62%,${p.a})`;
      ctx.shadowBlur = 12 * DPR;
      ctx.shadowColor = `hsla(${p.hue},100%,62%,.9)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    /* 缓慢下滚的坐标网格线 */
    const t = performance.now() / 1000;
    ctx.strokeStyle = 'rgba(0,240,255,0.05)';
    ctx.lineWidth = 1 * DPR;
    const off = (t * 30) % (80 * DPR);
    for (let y = -80 * DPR + off; y < H; y += 80 * DPR){
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let x = 0; x < W; x += 80 * DPR){
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  addEventListener('resize', resize);
  resize();
  draw();
})();

/* ---------- 时钟 ---------- */
(function(){
  const el = document.getElementById('clock');
  const tick = () => {
    const d = new Date();
    el.textContent = d.toTimeString().slice(0, 8);
  };
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
